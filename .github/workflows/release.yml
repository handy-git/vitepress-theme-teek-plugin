name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  idea:
    name: Build IntelliJ plugin
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: meta
        run: |
          VERSION=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "IntelliJ plugin version: ${VERSION}"

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: idea-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  vscode:
    name: Build VS Code extension
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: vscode

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VS Code extension version: ${VERSION}"

      - name: Install dependencies
        run: npm install

      - name: Package extension
        run: |
          mkdir -p dist
          npx @vscode/vsce package -o "dist/teek-markdown-preview-${{ steps.meta.outputs.version }}.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: dist/*.vsix
          if-no-files-found: error

  release:
    name: Publish release
    needs: [idea, vscode]
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: releases
          merge-multiple: true

      - name: Resolve tag
        id: meta
        run: |
          VERSION="${{ needs.idea.outputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          IDEA_VERSION: ${{ needs.idea.outputs.version }}
          VSCODE_VERSION: ${{ needs.vscode.outputs.version }}
        run: |
          IDEA_ASSET="https://github.com/${REPO}/releases/download/${TAG}/vitepress-theme-teek-plugin-${IDEA_VERSION}.zip"
          VSCODE_ASSET="https://github.com/${REPO}/releases/download/${TAG}/teek-markdown-preview-${VSCODE_VERSION}.vsix"
          MARKETPLACE="https://plugins.jetbrains.com/plugin/35492-teek-markdown-preview"
          {
            echo "更新记录: [点击查看](https://github.com/${REPO}/blob/main/CHANGELOG.md)"
            echo ""
            echo "| 渠道 | 下载 | 链接 |"
            echo "| --- | --- | --- |"
            echo "| idea | [点击下载](${IDEA_ASSET}) | [JetBrains 插件](${MARKETPLACE}) |"
            echo "| vscode | [点击下载](${VSCODE_ASSET}) | 暂无 |"
          } > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ls -R releases
          ASSETS=$(find releases -type f \( -name '*.zip' -o -name '*.vsix' \) | sort | tr '\n' ' ')
          if [ -z "${ASSETS}" ]; then
            echo "没有找到任何产物"
            exit 1
          fi
          echo "产物: ${ASSETS}"
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" ${ASSETS} --clobber --repo "${REPO}"
            gh release edit "${TAG}" --notes-file notes.md --repo "${REPO}"
          else
            gh release create "${TAG}" ${ASSETS} --title "${TAG}" --notes-file notes.md --repo "${REPO}"
          fi
